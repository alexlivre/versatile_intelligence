<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#00aaff" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shield / Hexagon -->
  <polygon points="25,5 45,15 45,35 25,45 5,35 5,15" fill="none" stroke="url(#grad)" stroke-width="2.5" filter="url(#glow)"/>
  <!-- Terminal cursor -->
  <path d="M 17 18 L 26 25 L 17 32" fill="none" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="28" y1="32" x2="35" y2="32" stroke="#00aaff" stroke-width="2.5" stroke-linecap="round"/>
</svg>
